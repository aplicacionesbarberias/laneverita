<style>
:root{
  --bg:#eef4f9; --card:#ffffff; --ink:#0d1b2a; --muted:#5b6b7c; --line:#dde6ef;
  --navy:#0b2a4a; --ice:#16a3d9; --ice-soft:#e3f4fb; --ok:#11875d; --ok-soft:#e2f5ec;
  --bad:#c8372d; --bad-soft:#fbe9e7; --warn:#b86e00; --warn-soft:#fff3dc; --accent:#ff6b3d;
  --r:16px; --sh:0 1px 2px rgba(13,27,42,.06),0 4px 14px rgba(13,27,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
label.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
label.chk input{margin-top:2px;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand>div{min-width:0}
.brand b{font-weight:800;letter-spacing:.5px;font-size:17px;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand b{font-size:14px}.hbtn{min-width:34px;padding:0 8px}}
@media (max-width:380px){.brand b{display:none}.brand small{font-size:13px;color:#fff;font-weight:600}}
.brand small{display:block;font-size:11.5px;color:#9fd8ef;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
.hbtn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.18)}
.hbtn svg{width:18px;height:18px}

/* ---------- nav ---------- */
nav.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:6px 12px;position:sticky;top:56px;z-index:25;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:9px 14px;border-radius:10px;display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button svg{width:18px;height:18px}
nav.tabs button.on{background:var(--ice-soft);color:var(--navy)}
@media (max-width:760px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding:4px 4px max(4px,env(safe-area-inset-bottom));justify-content:space-around;gap:0;box-shadow:0 -4px 14px rgba(13,27,42,.06)}
  nav.tabs button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;min-width:0}
  nav.tabs button svg{width:21px;height:21px}
  main{padding-bottom:90px!important}
}

main{max-width:1180px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:4px 0 12px;font-weight:700}
h3{font-size:16px;margin:0 0 10px;font-weight:700}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}

/* ---------- controls ---------- */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--navy);color:#fff;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ice{background:var(--ice)}
.btn.ok{background:var(--ok)}
.btn.ghost{background:var(--ice-soft);color:var(--navy)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.big{padding:15px 18px;font-size:17px;width:100%}
.btn svg{width:17px;height:17px}
.ibtn{border:1px solid var(--line);background:#fff;border-radius:9px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.ibtn:hover{color:var(--navy);border-color:var(--ice)}
.ibtn svg{width:16px;height:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;flex:1;min-width:130px}
input.i,select.i,textarea.i{border:1px solid var(--line);background:#fbfdff;border-radius:11px;padding:10px 12px;font-size:15px;color:var(--ink);width:100%;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--ice);box-shadow:0 0 0 3px rgba(22,163,217,.15);background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scrollx .chips{flex-wrap:nowrap}

/* ---------- period ---------- */
.period{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.period .range{display:flex;gap:6px;align-items:center}
.period .range input{width:150px;padding:7px 10px}
.period .lbl{font-size:13px;color:var(--muted);margin-left:auto}

/* ---------- kpis ---------- */
.hero{background:linear-gradient(135deg,#0b2a4a 0%,#12487a 60%,#1679b0 100%);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero .t{font-size:13.5px;color:#b9e6f7;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.hero .v{font-size:40px;font-weight:800;margin:4px 0;letter-spacing:-.5px}
.hero .s{font-size:14px;color:#d5eef8}
.hero .neg{color:#ffb3a8}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);border-left:4px solid var(--line)}
.kpi .t{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.k-ventas{border-color:var(--ice)}.kpi.k-gan{border-color:var(--ok)}.kpi.k-gas{border-color:var(--bad)}
.kpi.k-com{border-color:var(--warn)}.kpi.k-caja{border-color:var(--navy)}.kpi.k-cost{border-color:#9aa8b6}
.pos{color:var(--ok)}.neg{color:var(--bad)}

/* ---------- tables ---------- */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid #eef2f6;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
table.t tfoot td{font-weight:700;border-top:2px solid var(--line)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ice-soft);color:var(--navy)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

/* ---------- chart ---------- */
.chart{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bar .stack{width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:7px 7px 3px 3px;overflow:hidden;background:#f1f5f9}
.bar .g{background:var(--ok)}
.bar .c{background:#b9d6e6}
.bar .l{font-size:11px;color:var(--muted);white-space:nowrap}
.bar .n{font-size:10.5px;color:var(--ink);font-weight:600;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- POS ---------- */
.cat-t{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:16px 2px 8px}
.cat-t:first-child{margin-top:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:520px){.pgrid{grid-template-columns:repeat(2,1fr)}}
.prod{background:#fff;border:2px solid transparent;border-radius:16px;padding:12px;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;min-height:118px;position:relative;user-select:none;-webkit-user-select:none;transition:transform .08s,border-color .15s}
.prod:active{transform:scale(.97)}
.prod.in{border-color:var(--ice);background:#f3fbff}
.prod .nm{font-weight:700;font-size:15px;line-height:1.2}
.prod .st{font-size:12px;color:var(--muted)}
.prod .st.low{color:var(--warn);font-weight:600}
.prod .pr{font-size:19px;font-weight:800;color:var(--navy);margin-top:auto}
.prod.off{opacity:.45;cursor:not-allowed}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.qrow b{font-size:22px;font-weight:800;color:var(--navy);min-width:30px;text-align:center}
.qb{width:46px;height:42px;border-radius:12px;border:0;font-size:24px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qb.m{background:#e8eef4;color:var(--navy)}
.qb.p{background:var(--ice);color:#fff}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;box-shadow:0 -6px 24px rgba(13,27,42,.16);border-radius:18px 18px 0 0;padding:12px 16px max(12px,env(safe-area-inset-bottom))}
.cartbar .in{max-width:1148px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cartbar .tot{flex:1;min-width:150px}
.cartbar .tot small{display:block;color:var(--muted);font-size:13px}
.cartbar .tot b{font-size:26px}
.cartbar .paga{width:130px}
.cartbar .paga input{padding:8px 10px}
.cartbar .btns{display:flex;gap:8px}
.cartbar .btns .btn.ok{padding:14px 22px;font-size:17px}
.pos-pad{height:110px}
@media (max-width:760px){
  .cartbar{bottom:62px}
  .cartbar .btns{width:100%}.cartbar .btns .btn.ok{flex:1}
  .pos-pad{height:200px}
}

/* ---------- inventario ---------- */
.icard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.icard b{font-size:15px}
.lug{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.icard .row.small{flex-wrap:wrap;gap:6px 12px}
.lug span{background:#f3f7fb;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}
.lug small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lug b{font-size:18px;color:var(--navy)}
.only-m{display:none}
@media (max-width:760px){.only-d{display:none}.only-m{display:block}}

/* ---------- list items ---------- */
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #eef2f6}
.li:last-child{border-bottom:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:600}
.li .m span{font-size:13px;color:var(--muted)}
.li .a{font-weight:700;white-space:nowrap}
.li.anul{opacity:.5}
.li.anul .a{text-decoration:line-through}

.calc{background:var(--ice-soft);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.calc div{display:flex;flex-direction:column}
.calc small{font-size:12px;color:var(--muted);font-weight:600}
.calc b{font-size:20px;color:var(--navy)}
@media (max-width:520px){.calc{grid-template-columns:1fr 1fr}.calc div:last-child{grid-column:span 2}}

/* ---------- modal / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(9,22,38,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .15s}
.modal{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto;animation:up .18s}
.modal.wide{max-width:680px}
.modal h3{font-size:19px;margin-bottom:14px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
@keyframes fi{from{opacity:0}}
@keyframes up{from{transform:translateY(14px);opacity:0}}
.instalar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:75;width:calc(100% - 24px);max-width:440px;background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.3);padding:12px;display:flex;align-items:center;gap:12px;animation:up .25s}
.instalar img{width:52px;height:52px;border-radius:12px;flex:none}
.instalar .tx{flex:1;min-width:0}.instalar .tx b{display:block;font-size:15px}.instalar .tx span{font-size:12.5px;color:var(--muted)}
.instalar .x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 6px}
@media (min-width:761px){.instalar{bottom:24px}}
.instalar.arriba{top:max(12px,env(safe-area-inset-top));bottom:auto}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.tst{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:600;animation:up .2s;text-align:center}
.tst.ok{background:var(--ok)}.tst.bad{background:var(--bad)}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background-color:#0a3d78;background-size:cover;background-position:center;position:relative}
.login::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,30,60,.35),rgba(6,30,60,.75))}
.login>*{position:relative}
.lbox{background:#fff;border-radius:24px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lbox .logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:20px;text-align:center}
.lbox .logo b{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:.5px}
.lbox .logo img{width:100%;max-width:330px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.brand img{height:40px;width:auto;border-radius:8px;flex:none}
.lbox .logo span{color:var(--muted);font-size:14px}
.lbox form{display:flex;flex-direction:column;gap:12px}
.who-list{display:flex;flex-direction:column;gap:10px}
.who{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.who:hover{border-color:var(--ice);background:var(--ice-soft)}
.who b{font-size:17px;color:var(--navy)}.who span{font-size:13px;color:var(--muted)}
.who.sel{flex-direction:row;justify-content:space-between;align-items:center;background:var(--ice-soft);border-color:var(--ice)}
.who.sel span{color:var(--ice);font-weight:600}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy);display:block}
.dots i.on{background:var(--navy)}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border-radius:16px;border:0;background:#f0f5f9;font-size:24px;font-weight:700;color:var(--navy);cursor:pointer}
.pad button:active{background:var(--ice);color:#fff}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:40px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--ice);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sync{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}
.sync.busy{background:#fbbf24;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="spin"></div></div></div>
<div id="toast"></div>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = new Intl.NumberFormat('es-CO', {maximumFractionDigits:0});
const $$ = n => (n < 0 ? '-$' : '$') + fmtN.format(Math.abs(Math.round(+n || 0)));
const num = v => { const n = parseFloat(String(v ?? '').replace(/\./g,'').replace(',', '.')); return isNaN(n) ? 0 : n; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const d0 = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const ymd = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fFecha = d => { const x = new Date(d); return `${DIAS[x.getDay()]} ${x.getDate()} ${MESES[x.getMonth()]}`; };
const fHora = d => new Date(d).toLocaleTimeString('es-CO', {hour:'numeric', minute:'2-digit'});
const sum = (arr, f) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function toast(msg, type='') {

function errMsg(e) {
  const m = e?.message || String(e);
  if (/Invalid login/i.test(m)) return 'Usuario o contraseña incorrectos';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión a internet';
  return m;
}
function modal(html, cls='') {
  closeModal();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
  const f = ov.querySelector('input:not([type=hidden]),select'); if (f && window.innerWidth > 760) f.focus();
  return ov;
}
function closeModal() { $('#ov')?.remove(); }
function confirmar(msg, okTxt='Sí, continuar', danger=false) {
  return new Promise(res => {
    const ov = modal(`<h3>${msg}</h3><div class="acts"><button class="btn line" id="cNo">Cancelar</button><button class="btn ${danger?'danger':''}" id="cSi">${okTxt}</button></div>`);
    ov.querySelector('#cNo').onclick = () => { closeModal(); res(false); };

  });
}

const prod = id => S.productos.find(p => p.id === id);
const stk = (pt, pid) => S.stock[pt + '-' + pid] || 0;

const bodega = () => S.puntos.find(p => p.bodega);

const costo = pid => +S.costos[pid] || 0;

function inicioMes() { const h = new Date(); return new Date(h.getFullYear(), h.getMonth(), 1); }
function estadoFijos() {
  const hoy = new Date().getDate(), finMes = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
  return S.fijos.filter(f => f.activo).map(f => {
    const pago = S.gastosMes.filter(g => g.fijo_id === f.id).sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
    const dia = Math.min(f.dia_pago, finMes);
    return { f, pago, dia, vencido: !pago && hoy >= dia, faltan: dia - hoy };
  });
}
function rango() {
  const t = S.per.tipo, hoy = d0(new Date());
  let a, b;
  if (t === 'hoy') { a = hoy; b = addDays(hoy, 1); }
  else if (t === 'semana' || t === 'semana_ant') {
    a = addDays(hoy, -((hoy.getDay() + 6) % 7)); if (t === 'semana_ant') a = addDays(a, -7); b = addDays(a, 7);
  }
  else if (t === 'mes') { a = new Date(hoy.getFullYear(), hoy.getMonth(), 1); b = new Date(hoy.getFullYear(), hoy.getMonth()+1, 1); }
  else if (t === 'todo') { a = new Date(2020, 0, 1); b = addDays(hoy, 1); }
  else { a = S.per.d1 ? parseYmd(S.per.d1) : hoy; b = addDays(S.per.d2 ? parseYmd(S.per.d2) : hoy, 1); }
  return {a, b};
}
function rangoTxt() {
  const {a, b} = rango(); const z = addDays(b, -1);
  if (S.per.tipo === 'todo') return 'Desde el inicio';
  return ymd(a) === ymd(z) ? fFecha(a) : `${fFecha(a)} – ${fFecha(z)}`;
}

/* ---------- supabase ---------- */
const configurado = !CONFIG.SUPABASE_URL.includes('PEGA_AQUI');
const sb = configurado ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY) : null;

async function all(build) {
  const out = []; let from = 0;
  for (;;) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    out.push(...data); if (data.length < 1000) break; from += 1000;
  }
  return out;
}
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw error; return data;
}

async function cargarCatalogo() {
  const [pts, prods, st] = await Promise.all([
    all(() => sb.from('puntos').select('*').order('id')),
    all(() => sb.from('productos').select('*').order('nombre')),
    all(() => sb.from('stock').select('*'))
  ]);
  S.puntos = pts.sort((a, b) => (b.bodega === true) - (a.bodega === true) || a.id - b.id); S.productos = prods;
  if (S.dueno && (!S.pv || S.puntos.find(p => p.id === S.pv)?.bodega)) S.pv = pVenta()[0]?.id;
  S.stock = {}; st.forEach(r => S.stock[r.punto_id + '-' + r.producto_id] = r.cantidad);
  if (S.dueno) {
    const c = await all(() => sb.from('productos_costo').select('*'));
    S.costos = {}; c.forEach(r => S.costos[r.producto_id] = +r.costo_unitario);
  }
}
async function cargarPeriodo() {
  const {a, b} = rango(); const A = a.toISOString(), B = b.toISOString();
  const rng = q => q.gte('fecha', A).lt('fecha', B).order('fecha', {ascending:false});
  const tareas = [all(() => rng(sb.from('ventas').select('*, venta_items(*)'))), all(() => rng(sb.from('salidas_caja').select('*')))];
  if (S.dueno) tareas.push(
    all(() => rng(sb.from('venta_costos').select('item_id,costo_unit,fecha'))),
    all(() => rng(sb.from('compras').select('*'))),
    all(() => rng(sb.from('gastos').select('*'))),
    all(() => rng(sb.from('base_movs').select('*'))),
    all(() => rng(sb.from('ajustes').select('*'))),
    all(() => rng(sb.from('liquidaciones').select('*'))),
    rpc('totales_base'),
    all(() => sb.from('gastos_fijos').select('*').order('dia_pago')),
    all(() => sb.from('gastos').select('*').not('fijo_id', 'is', null).gte('fecha', inicioMes().toISOString()))
  );
  const r = await Promise.all(tareas);
  S.ventas = r[0]; S.salidas = r[1];

    [S.compras, S.gastos, S.base, S.ajustes, S.liqs, S.tot, S.fijos, S.gastosMes] = r.slice(3);
  }
}

  });

let cargando = null;
async function recargar({catalogo=true, periodo=true, silencioso=false} = {}) {
  if (cargando) return cargando;
  S.busy = true; marcarSync();
  cargando = (async () => {
    try {
      await Promise.all([catalogo && cargarCatalogo(), periodo && cargarPeriodo()]);
      S.loaded = true; guardarCache(); render();
    } catch (e) { if (!silencioso) toast(errMsg(e), 'bad'); console.error(e); }
    finally { S.busy = false; cargando = null; marcarSync(); }
  })();
  return cargando;
}
function marcarSync() { const el = $('#sync'); if (el) el.className = 'sync' + (S.busy ? ' busy' : ''); }

let rtTimer;
function tiempoReal() {
  const ping = () => { clearTimeout(rtTimer); rtTimer = setTimeout(() => recargar({silencioso:true}), 700); };
  sb.channel('neverita')
    .on('postgres_changes', {event:'*', schema:'public', table:'stock'}, ping)
    .on('postgres_changes', {event:'*', schema:'public', table:'ventas'}, ping)
    .on('postgres_changes', {event:'*', schema:'public', table:'productos'}, ping)
    .on('postgres_changes', {event:'*', schema:'public', table:'salidas_caja'}, ping)
    .subscribe();
}

/* ---------- cálculos ---------- */
function ventasVal(p = 0) { return S.ventas.filter(v => !v.anulada && (!p || v.punto_id === p)); }
function calc(p = 0) {
  const V = ventasVal(p);
  let ventas = 0, costoV = 0, unid = 0; const porProd = {}, porDia = {}, porPunto = {};
  for (const v of V) {
    ventas += +v.total;
    const pp = porPunto[v.punto_id] ||= {v:0, c:0, n:0, u:0}; pp.v += +v.total; pp.n++;
    const dk = ymd(v.fecha); const dd = porDia[dk] ||= {v:0, c:0};
    dd.v += +v.total;
    for (const it of v.venta_items || []) {
      const c = (S.vcost[it.id] ?? 0) * it.cantidad;
      costoV += c; unid += it.cantidad; pp.c += c; pp.u += it.cantidad; dd.c += c;
      const pr = porProd[it.producto_id] ||= {n:it.nombre, u:0, v:0, c:0};
      pr.u += it.cantidad; pr.v += +it.subtotal; pr.c += c;
    }
  }
  const G = S.gastos.filter(g => !p || g.punto_id === p);
  const C = S.compras.filter(c => !c.inicial && (!p || c.punto_id === p));
  const A = S.ajustes.filter(x => (!p || x.punto_id === p) && x.diferencia < 0);
  const gastos = sum(G, g => g.monto), compras = sum(C, c => c.total);
  const faltantes = sum(A, x => -x.diferencia * x.costo_unit);
  const ganancia = ventas - costoV;
  const utilidad = ganancia - gastos - faltantes;
  const baseP = sum(S.base, b => b.tipo === 'ingreso' ? b.monto : -b.monto) - sum(S.salidas.filter(x => x.tipo === 'otro'), x => x.monto);
  return { V, ventas, costoV, unid, ganancia, gastos, compras, faltantes, utilidad, baseP, porProd, porDia, porPunto, nVentas:V.length };
}
function caja() {
  const t = S.tot || {};
  const base = (+t.ingresos||0) - (+t.retiros||0);
  const queda = base - (+t.compras||0) - (+t.gastos||0);
  const ventasCaja = (+t.ventas||0) - (+t.salidas||0);
  return { base, compras:+t.compras||0, gastos:+t.gastos||0, ventas:+t.ventas||0, salidas:+t.salidas||0, ventasCaja, queda, total: queda + ventasCaja };
}

  const total = sum(items, x => x.p.precio_venta * x.c), nU = sum(items, x => x.c);
  const rec = num(S.recibido);
  const tile = x => {

    </div>`;
  };
  return `
  <div class="row between" style="margin-bottom:12px">
    <h2 style="margin:0">Vender ${S.dueno ? '' : `<span class="tag">${esc(nombrePunto(pv))}</span>`}</h2>

  ${activos.length ? Object.entries(grupos).map(([c, arr]) => `${Object.keys(grupos).length > 1 ? `<div class="cat-t">${esc(c)}</div>` : ''}<div class="pgrid">${arr.map(tile).join('')}</div>`).join('')
    : `<div class="card empty">Todavía no hay productos. ${S.dueno ? 'Regístralos en Compras.' : 'El dueño debe cargarlos.'}</div>`}

async function cobrar(btn) {

function textoLiquidacion() {
  const p = S.dueno ? S.fPunto : S.perfil.punto_id; const V = ventasVal(p); const pp = {};

  const SAL = S.salidas.filter(x => !p || x.punto_id === p), tv = sum(V, v => v.total), ts = sum(SAL, x => x.monto);

      <div class="acts" style="flex-basis:100%"><button type="button" class="btn line" data-a="close">Cancelar</button><button class="btn">Guardar</button></div>
    </form>`);
  ov.querySelector('#fFijo').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const row = {concepto:f.concepto.value.trim(), categoria:f.cat.value, monto:num(f.monto.value), dia_pago:Math.min(31, Math.max(1, Math.round(num(f.dia.value))))};
    if (id) row.activo = f.activo.checked;
    const r = id ? await sb.from('gastos_fijos').update(row).eq('id', id) : await sb.from('gastos_fijos').insert(row);
    if (r.error) return toast(errMsg(r.error), 'bad');
    closeModal(); toast('Gasto fijo guardado', 'ok'); recargar({catalogo:false});
  };
}

/* ---------- BASE ---------- */
function vBase() {
  const K = caja(), B = S.base, R = calc(0);
  return `${periodoBar()}<h2>Manejo de la base</h2>
  <div class="hero">
    <div class="t">Te queda de la base</div>
    <div class="v num ${K.queda < 0 ? 'neg' : ''}">${$$(K.queda)}</div>
    <div class="s num">Base ${$$(K.base)} − Compras ${$$(K.compras)} − Gastos ${$$(K.gastos)} pagados con la base · desde el inicio</div>
  </div>
  <div class="kpis">
    <div class="kpi k-caja"><div class="t">Base registrada</div><div class="v num">${$$(K.base)}</div><div class="s">Capital que has metido</div></div>
    <div class="kpi k-com"><div class="t">Invertido en compras</div><div class="v num">${$$(K.compras)}</div><div class="s">${pct(K.compras, K.base)}% de la base</div></div>
    <div class="kpi k-gas"><div class="t">Gastos</div><div class="v num neg">${$$(K.gastos)}</div></div>
    <div class="kpi k-ventas"><div class="t">Ventas</div><div class="v num">${$$(K.ventas)}</div><div class="s">${K.salidas ? 'Menos ' + $$(K.salidas) + ' sacado de la caja = ' + $$(K.ventasCaja) : 'Plata que ha entrado'}</div></div>
    <div class="kpi k-gan"><div class="t">Total (queda + ventas en caja)</div><div class="v num">${$$(K.total)}</div><div class="s">Lo que debería haber en caja</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Registrar movimiento de base</h3>
      <form id="fBase" class="row" style="gap:12px">
        <div class="chips" style="flex-basis:100%"><label class="chip on" id="tIng"><input type="radio" name="tipo" value="ingreso" checked hidden>Meter base</label><label class="chip" id="tRet"><input type="radio" name="tipo" value="retiro" hidden>Sacar plata</label></div>
        <label class="f">Valor<input class="i num" name="monto" inputmode="numeric" required placeholder="$1.500.000"></label>
        <label class="f">Fecha<input class="i" type="date" name="fecha" value="${ymd(new Date())}"></label>
        <label class="f" style="flex-basis:100%">Nota<input class="i" name="nota" placeholder="Opcional"></label>
        <button class="btn big" style="flex-basis:100%">Guardar</button>
      </form>
      <div class="small muted" style="margin-top:14px">En este periodo (${rangoTxt()}): base ${$$(R.baseP)} · compras ${$$(R.compras)} · gastos ${$$(R.gastos)} · ventas ${$$(R.ventas)}</div>
    </div>
    <div class="card"><h3>Movimientos del periodo</h3>
      ${B.length ? B.map(b => `<div class="li"><div class="m"><b>${b.tipo === 'ingreso' ? 'Base ingresada' : 'Retiro'}</b><span>${fFecha(b.fecha)}${b.nota ? ' · ' + esc(b.nota) : ''}</span></div><div class="a num ${b.tipo==='ingreso'?'pos':'neg'}">${b.tipo==='ingreso'?'+':'−'}${$$(b.monto)}</div><button class="ibtn" data-a="delBase" data-v="${b.id}">${ic('trash')}</button></div>`).join('') : '<div class="empty">Sin movimientos en este periodo</div>'}
    </div>
  </div>`;
}
function initBase() {
  const f = $('#fBase'); if (!f) return;
  f.querySelectorAll('input[name=tipo]').forEach(r => r.onchange = () => { $('#tIng').classList.toggle('on', f.tipo.value === 'ingreso'); $('#tRet').classList.toggle('on', f.tipo.value === 'retiro'); });
  f.onsubmit = async e => {
    e.preventDefault();
    const r = await sb.from('base_movs').insert({tipo:f.tipo.value, monto:num(f.monto.value), fecha:fechaISO(f.fecha.value), nota:f.nota.value.trim() || null});
    if (r.error) return toast(errMsg(r.error), 'bad');
    toast('Movimiento guardado', 'ok'); recargar({catalogo:false});
  };
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
function afterRender() {
  const b = $('#busq'); if (b) b.oninput = () => { S.busq = b.value; const pos = b.selectionStart; render(); const nb = $('#busq'); nb.focus(); nb.setSelectionRange(pos, pos); };
  const ib = $('#invBusq'); if (ib) ib.oninput = () => { S.invBusq = ib.value; const pos = ib.selectionStart; render(); const n = $('#invBusq'); n.focus(); n.setSelectionRange(pos, pos); };
  const ii = $('#invInact'); if (ii) ii.onchange = () => { S.invInact = ii.checked; render(); };
  const rc = $('#recibido'); if (rc) rc.oninput = () => {
    S.recibido = rc.value; const total = sum(Object.entries(S.carrito), ([id, c]) => (prod(+id)?.precio_venta || 0) * c), r = num(rc.value);
    $('#vuelto').innerHTML = r ? (r >= total ? `Vuelto <b class="num pos">${$$(r - total)}</b>` : `<span class="neg">Faltan ${$$(total - r)}</span>`) : '';
  };
  const p1 = $('#pd1'), p2 = $('#pd2');
  if (p1) [p1, p2].forEach(x => x.onchange = () => { S.per.d1 = p1.value; S.per.d2 = p2.value; recargar({catalogo:false}); });
  initCompras(); initGastos(); initBase();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  switch (a) {
    case 'tab': S.tab = v; guardarUI(); render(); window.scrollTo(0, 0); break;
    case 'refresh': recargar(); break;
    case 'salir': salir(); break;
    case 'pin': mPin(); break;
    case 'close': closeModal(); break;
    case 'per': S.per.tipo = v; if (v === 'rango' && !S.per.d1) { const {a:x, b:y} = rango(); S.per.d1 = ymd(x); S.per.d2 = ymd(addDays(y, -1)); } render(); recargar({catalogo:false}); break;
    case 'fpunto': S.fPunto = +v; render(); break;
    case 'pv': S.pv = +v; S.carrito = {}; guardarUI(); render(); break;
    case 'cat': S.cat = v; render(); break;
    case 'add': { const id = +v, en = S.carrito[id] || 0;
      if (en >= stk(S.pv, id)) { toast(stk(S.pv, id) ? 'No hay más unidades de ese producto' : 'Producto agotado en este punto', 'bad'); break; }
      S.carrito[id] = en + 1; if (navigator.vibrate) navigator.vibrate(15); render(); break; }
    case 'menos': { const id = +v; S.carrito[id] = (S.carrito[id] || 0) - 1; if (S.carrito[id] <= 0) delete S.carrito[id]; render(); break; }
    case 'vaciar': S.carrito = {}; S.recibido = ''; render(); break;
    case 'cartToggle': S.cartOpen = !S.cartOpen; render(); break;
    case 'cobrar': cobrar(el); break;
    case 'nuevoProd': mProducto(); break;
    case 'editProd': mProducto(+v); break;
    case 'traslado': mTraslado(+v); break;
    case 'conteo': mConteo(); break;
    case 'enviar': mEnviar(); break;
    case 'enviarPt': mEnviar(+v); break;
    case 'conteoPt': mConteo(+v); break;
    case 'sug': { const f = $('#fCompra'); f.pventa.value = v; f.pventa.dispatchEvent(new Event('input')); break; }
    case 'anular':
      if (!await confirmar('¿Anular esta venta? Las unidades vuelven al inventario.', 'Anular venta', true)) break;
      try { await rpc('anular_venta', {p_id:+v}); toast('Venta anulada', 'ok'); recargar(); } catch (er) { toast(errMsg(er), 'bad'); } break;
    case 'delCompra':
      if (!await confirmar('¿Borrar esta compra? Las unidades se sacan del inventario.', 'Borrar', true)) break;
      try { await rpc('eliminar_compra', {p_id:+v}); toast('Compra borrada', 'ok'); recargar(); } catch (er) { toast(errMsg(er), 'bad'); } break;
    case 'delGasto': case 'delBase': case 'delLiq': {
      if (!await confirmar('¿Borrar este registro?', 'Borrar', true)) break;
      const t = {delGasto:'gastos', delBase:'base_movs', delLiq:'liquidaciones'}[a];
      const r = await sb.from(t).delete().eq('id', +v); if (r.error) toast(errMsg(r.error), 'bad'); else { toast('Borrado', 'ok'); recargar({catalogo:false}); } break; }
    case 'liquidar': mLiquidar(); break;
    case 'nuevoFijo': mFijo(); break;
    case 'editFijo': mFijo(+v); break;
    case 'pagarFijo': S.pagarFijo = +v; render(); $('#fGasto')?.scrollIntoView({behavior:'smooth', block:'center'}); break;
    case 'cancelFijo': S.pagarFijo = null; render(); break;
    case 'salida': mSalida(); break;
    case 'delSalida':
      if (!await confirmar('¿Borrar esta salida de caja?', 'Borrar', true)) break;
      try { await rpc('borrar_salida', {p_id:+v}); toast('Borrada', 'ok'); recargar({catalogo:false}); } catch (er) { toast(errMsg(er), 'bad'); } break;
    case 'regSalida': S.salidaSel = +v; render(); $('#fCompra')?.scrollIntoView({behavior:'smooth'}); break;
    case 'cancelSalida': S.salidaSel = null; render(); break;
    case 'listoSalida': {
      const r = await sb.from('salidas_caja').update({estado:'listo'}).eq('id', +v);
      if (r.error) toast(errMsg(r.error), 'bad'); else { if (S.salidaSel === +v) S.salidaSel = null; toast('Compra completa', 'ok'); recargar({catalogo:false}); } break; }
    case 'copiar': { const t = textoLiquidacion();
      try { await navigator.clipboard.writeText(t); toast('Resumen copiado', 'ok'); }
      catch { modal(`<h3>Copia el resumen</h3><textarea class="i" rows="12">${esc(t)}</textarea><div class="acts"><button class="btn" data-a="close">Listo</button></div>`); } break; }
    case 'wa': window.open('https://wa.me/?text=' + encodeURIComponent(textoLiquidacion()), '_blank'); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('focus', () => { if (S.user && S.loaded) recargar({silencioso:true}); });

/* ---------- instalar como app ---------- */
let eventoInstalar = null;
const yaInstalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function avisoInstalar() {
  if (yaInstalada() || $('#instalar')) return;
  const cerrado = +lsGet('nv-inst-cerrado') || 0; if (Date.now() - cerrado < 3 * 864e5) return;
  if (!eventoInstalar && !esIOS) return;
  const el = document.createElement('div'); el.className = 'instalar' + (S.user ? '' : ' arriba'); el.id = 'instalar';
  el.innerHTML = `<img src="icon-192.png" alt=""><div class="tx"><b>Descargar la aplicación</b><span>Instala La Neverita en tu celular y ábrela como una app</span></div>
    <button class="btn ok sm" id="instBtn">Descargar</button><button class="x" id="instX" aria-label="Cerrar">×</button>`;
  document.body.appendChild(el);
  $('#instX').onclick = () => { lsSet('nv-inst-cerrado', Date.now()); el.remove(); };
  $('#instBtn').onclick = async () => {
    if (eventoInstalar) { eventoInstalar.prompt(); const r = await eventoInstalar.userChoice; eventoInstalar = null; el.remove(); if (r.outcome === 'accepted') toast('¡Listo! Búscala en tu pantalla de inicio', 'ok'); }
    else modal(`<h3>Instalar en iPhone</h3><ol style="padding-left:20px;line-height:1.7"><li>Abre este link en <b>Safari</b>.</li><li>Toca el botón <b>Compartir</b> (el cuadrito con la flecha hacia arriba).</li><li>Elige <b>“Agregar a inicio”</b> y luego <b>Agregar</b>.</li></ol><div class="acts"><button class="btn" data-a="close">Entendido</button></div>`);
  };
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; avisoInstalar(); });
window.addEventListener('appinstalled', () => { $('#instalar')?.remove(); toast('App instalada', 'ok'); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
setTimeout(avisoInstalar, 1500);

iniciar();
</script>
